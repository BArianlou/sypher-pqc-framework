# ===============================================================================
# MODULE MANIFEST: SYPHER SECURITY INTEGRITY AUDIT (GITHUB ACTIONS)
# ===============================================================================
# System Purpose:
#     Serves as the automated SCIENTIFIC_VALIDATION gate for the SYPHER engine.
#     Orchestrates an ephemeral compute environment to verify the structural
#     integrity of the adversarial Deep Q-Network, the post-quantum cryptographic
#     (PQC) routing logic, and authenticated cipher layers prior to deployment.
#
# State Boundaries:
#     - Strictly manages CI/CD lifecycle states, container volume mounts,
#       runtime dependencies, and exit-code aggregation.
#     - Delegates all mathematical proofs, tensor transformations, KEM encapsulation,
#       and Bellman updates directly to the underlying Python execution layer.
#
# Mathematical/Physical Invariants:
#     1. Binary Veto Gate:
#        The pipeline evaluates as a strict boolean function: any non-zero exit code
#        emitted during dependency installation, unit testing, or MDP execution
#        triggers an immediate pipeline termination (Fail-Fast).
#     2. Temporal Bounding:
#        The integration verification run is clamped strictly to 2 complete episodes
#        to prove end-to-end gradient flow, tensor reshaping, and KEM state-binding
#        without incurring runner latency.
#
# Design Rationale:
#     Manual validation of dynamic cryptographic routing architectures introduces
#     configuration drift and delayed detection of cryptographic regressions.
#     This declarative pipeline enforces the Triune DATA_SUPREMACY directive by
#     proving that computational graphs compile, ciphers execute, and neural
#     gradients backpropagate cleanly on every prospective merge.
# ===============================================================================

name: Sypher Security Integrity Audit

# [STRUCTURAL CALLOUT] Event-Driven Execution Trigger
# Enforces continuous validation across direct commits and pull requests.
# Prevents unverified state transitions or compromised cryptographic logic
# from contaminating the core codebase lineage.
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Adversarial Architecture & Cryptographic Integrity Gate
    # [STRUCTURAL CALLOUT] Ephemeral Compute Allocation
    # Provisions a clean, standardized Linux environment for every execution.
    # Eliminates environment-dependent side effects by forcing execution in
    # a mathematically neutral, stateless container.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Workspace Assets
        uses: actions/checkout@v4

      - name: Set up Python 3.10 Runtime
        uses: actions/setup-python@v5
        with:
          # [STRUCTURAL CALLOUT] Runtime Architecture Lock
          # Binds execution strictly to Python 3.10, ensuring ABI stability for
          # TensorFlow graphs, PySpark bindings, and native cryptography primitives.
          python-version: "3.10"
          cache: "pip"

      - name: Install Enterprise Dependencies
        # [STRUCTURAL CALLOUT] Deterministic Dependency Resolution
        # Upgrades core packaging tools and enforces pinned project requirements,
        # ensuring neural backbones and cryptographic primitives resolve deterministically.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Pre-Flight Integrity Tests
        # [STRUCTURAL CALLOUT] Structural Veto Gate
        # Runs unit-level sanity assertions (file mounts, runtime version, cipher round-trips)
        # before allocating resources to neural computational graphs.
        run: |
          python -m pytest tests/ -v || python -m unittest discover -s src/ -p "test_*.py"

      - name: Run Sypher Intelligence Audit (Micro-Execution)
        # [STRUCTURAL CALLOUT] Micro-Execution Smoke Test
        # Executes the primary adversarial orchestration loop with a clamped horizon
        # (--episodes 2). Proves that adversarial MDP transitions, dimension-safe
        # tensor reshaping, and Bellman updates execute end-to-end without collapse.
        run: |
          python src/training_loop.py --episodes 2
